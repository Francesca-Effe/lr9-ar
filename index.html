<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>LR9 by Lorenzo - Bâche AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- TEMPORARY DEBUG CONSOLE - remove this line once everything works -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* Force MindAR's camera + scene to fill the screen in any orientation */
        #ar-container,
        #ar-container video,
        #ar-container canvas {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100dvh !important;
            object-fit: cover !important;
        }

        /* Hide A-Frame's default VR/AR enter buttons */
        .a-enter-vr,
        .a-enter-ar {
            display: none !important;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            color: #ff7a00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #loading-screen h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        #loading-screen p {
            color: #fff;
            font-size: 14px;
            opacity: 0.7;
        }

        #scan-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ff7a00;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 998;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #scan-hint.hidden {
            opacity: 0;
        }

        /* Full-screen video overlay, independent of marker size/distance */
        #fullscreen-video-wrap {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            background: #000;
            z-index: 500;
            display: none;
        }

        #fullscreen-video-wrap.active {
            display: block;
        }

        #fullscreen-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* fills screen in both portrait and landscape, crops overflow */
        }

        #unmute-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 998;
            background: #ff7a00;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }

        #close-video-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 998;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            display: none;
        }
    </style>
</head>

<body>

    <div id="loading-screen">
        <h1>LR9 by Lorenzo</h1>
        <p>Chargement de l'expérience AR...</p>
    </div>

    <div id="scan-hint">Pointez la caméra vers la bâche</div>
    <button id="unmute-btn">🔊 Activer le son</button>
    <button id="close-video-btn">✕</button>

    <!-- Full-screen video overlay, shown on top of the camera feed once the marker is found -->
    <div id="fullscreen-video-wrap">
        <video id="lr9video-fullscreen" playsinline webkit-playsinline muted loop></video>
    </div>

    <a-scene id="ar-container"
        mindar-image="imageTargetSrc:images/targets.mind; autoStart: true; uiScanning: no; uiLoading: no;"
        color-space="sRGB" embedded renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
        <a-assets></a-assets>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const target = document.querySelector('#target');
        const loadingScreen = document.querySelector('#loading-screen');
        const scanHint = document.querySelector('#scan-hint');
        const unmuteBtn = document.querySelector('#unmute-btn');
        const closeBtn = document.querySelector('#close-video-btn');
        const videoWrap = document.querySelector('#fullscreen-video-wrap');
        const video = document.querySelector('#lr9video-fullscreen');

        video.src = 'images/lr9-ar.mp4';

        sceneEl.addEventListener('loaded', () => {
            loadingScreen.style.display = 'none';
        });

        target.addEventListener('targetFound', () => {
            scanHint.classList.add('hidden');
            videoWrap.classList.add('active');
            closeBtn.style.display = 'block';
            video.currentTime = 0;
            video.play().catch(err => console.warn('Autoplay blocked:', err));
            unmuteBtn.style.display = 'block';
        });

        target.addEventListener('targetLost', () => {
            // Comment the next 4 lines out if you want the video to KEEP PLAYING
            // full-screen even after the phone is no longer pointed at the bâche.
            scanHint.classList.remove('hidden');
            videoWrap.classList.remove('active');
            video.pause();
            closeBtn.style.display = 'none';
        });

        unmuteBtn.addEventListener('click', () => {
            video.muted = false;
            unmuteBtn.style.display = 'none';
        });

        closeBtn.addEventListener('click', () => {
            videoWrap.classList.remove('active');
            video.pause();
            closeBtn.style.display = 'none';
            scanHint.classList.remove('hidden');
        });

        // Keep everything correctly sized through device rotation
        function handleResize() {
            // 100dvh in CSS already reacts to orientation changes on modern
            // browsers, this just forces a reflow for older Android WebViews.
            document.body.style.height = window.innerHeight + 'px';
        }
        window.addEventListener('resize', handleResize);
        window.addEventListener('orientationchange', handleResize);
        handleResize();
    </script>

</body>

</html>
