<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>LR9 by Lorenzo - Bâche AR</title>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, Helvetica, sans-serif;
        }

        #loading-screen {
            position: fixed;
            inset: 0;
            background: #000;
            color: #ff7a00;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #loading-screen h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        #loading-screen p {
            color: #fff;
            font-size: 14px;
            opacity: 0.7;
        }

        #scan-hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #ff7a00;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 998;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #scan-hint.hidden {
            opacity: 0;
        }

        #unmute-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 998;
            background: #ff7a00;
            color: #000;
            border: none;
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>

<body>

    <div id="loading-screen">
        <h1>LR9 by Lorenzo</h1>
        <p>Chargement de l'expérience AR...</p>
    </div>

    <div id="scan-hint">Pointez la caméra vers la bâche</div>
    <button id="unmute-btn">🔊 Activer le son</button>

    <a-scene mindar-image="imageTargetSrc: ./images/targets.mind; autoStart: true; uiScanning: no; uiLoading: no;"
        color-space="sRGB" embedded renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: true">
        <a-assets>
            <video id="lr9video" src="./images/lr9-ar.mp4" preload="auto" loop playsinline webkit-playsinline muted
                crossorigin="anonymous"></video>
        </a-assets>

        <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse;"></a-camera>

        <a-entity id="target" mindar-image-target="targetIndex: 0">
            <!--
        width / height below must match the real aspect ratio of your bâche
        (4700mm x 1500mm ≈ 3.13:1). Adjust "width" and "height" accordingly,
        the plane is centered on the tracked image by default.
      -->
            <a-video src="#lr9video" width="1" height="0.319" position="0 0 0" rotation="0 0 0"></a-video>
        </a-entity>
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const target = document.querySelector('#target');
        const video = document.querySelector('#lr9video');
        const loadingScreen = document.querySelector('#loading-screen');
        const scanHint = document.querySelector('#scan-hint');
        const unmuteBtn = document.querySelector('#unmute-btn');

        sceneEl.addEventListener('loaded', () => {
            loadingScreen.style.display = 'none';
        });

        target.addEventListener('targetFound', () => {
            scanHint.classList.add('hidden');
            video.currentTime = 0;
            video.play().catch(err => console.warn('Autoplay blocked:', err));
            unmuteBtn.style.display = 'block';
        });

        target.addEventListener('targetLost', () => {
            scanHint.classList.remove('hidden');
            video.pause();
        });

        unmuteBtn.addEventListener('click', () => {
            video.muted = false;
            unmuteBtn.style.display = 'none';
        });
    </script>

</body>

</html>
