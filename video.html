<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>LR9 by Lorenzo</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #video-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            /* height is set precisely in JS to match the real visible viewport,
         avoiding overflow under mobile browser address/nav bars */
        }

        #video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>

<body>

    <div id="video-wrap">
        <video id="video" src="images/lr9-ar.mp4" playsinline webkit-playsinline loop muted autoplay></video>
    </div>

    <script>
        const wrap = document.querySelector('#video-wrap');
        const video = document.querySelector('#video');

        function sizeToViewport() {
            wrap.style.height = window.innerHeight + 'px';
        }
        sizeToViewport();
        window.addEventListener('resize', sizeToViewport);
        window.addEventListener('orientationchange', sizeToViewport);

        // Muted autoplay is allowed on virtually all mobile browsers without
        // needing a tap, since there's no audio track to worry about.
        video.play().catch(err => console.warn('Autoplay issue:', err));
    </script>

</body>

</html>
