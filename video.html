<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>LR9 by Lorenzo</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #video-wrap {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            /* height set precisely in JS to match the real visible viewport */
        }

        #video {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
        }
    </style>
</head>

<body>

    <div id="video-wrap">
        <video id="video" src="./lr9-ar.mp4" playsinline webkit-playsinline loop muted autoplay></video>
    </div>

    <script>
        const wrap = document.querySelector('#video-wrap');
        const video = document.querySelector('#video');

        function sizeToViewport() {
            wrap.style.height = window.innerHeight + 'px';
        }
        sizeToViewport();
        window.addEventListener('resize', sizeToViewport);
        window.addEventListener('orientationchange', sizeToViewport);

        video.addEventListener('loadedmetadata', () => {
            console.log('Video native size:', video.videoWidth, 'x', video.videoHeight);
        });

        video.play().catch(err => console.warn('Autoplay issue:', err));
    </script>

</body>

</html>
